<ytd-guide-section-renderer class="style-scope ytd-guide-renderer" guide-persistent-and-visible="">

<yt-attributed-string class="style-scope yt-formatted-string">
</yt-attributed-string>
</yt-formatted-string>
</h3>
<div id="items" class="style-scope ytd-guide-section-renderer">
<ytd-guide-entry-renderer class="style-scope ytd-guide-section-renderer" is-primary="" line-end-style="none" active="">

  <tp-yt-paper-item role="link" class="style-scope ytd-guide-entry-renderer" style-target="host" tabindex="0" aria-disabled="false">

    <span class="guide-entry-count style-scope ytd-guide-entry-renderer">  </span>

</div>
  
</tp-yt-paper-item>
</a>

</ytd-guide-entry-renderer>

    <yt-formatted-string class="title style-scope ytd-guide-entry-renderer">Shorts</yt-formatted-string>
    
    <span class="guide-entry-count style-scope ytd-guide-entry-renderer">  </span>

</div>
